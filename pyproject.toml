[project]
name = "deeds_collector"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.5",
    "beautifulsoup4>=4.15.0",
    "html5lib>=1.1",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
